<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pré-visualização</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#141210;--ink:#efe8dd;--accent:#d9a066;--soft:#221e1a;--line:rgba(239,232,221,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:300 16px/1.7 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.disp{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.02em}
.wrap{width:min(1240px,100% - 40px);margin-inline:auto}
.ribbon{border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:10px 16px;color:var(--accent)}
header{display:flex;justify-content:space-between;align-items:center;padding:24px 0}
.logo{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;max-width:65%}
.pill{border:1px solid var(--line);border-radius:40px;padding:10px 18px;font-size:13px;text-decoration:none;transition:background .3s,color .3s}
.pill:hover{background:var(--ink);color:var(--bg)}
.hero{position:relative;padding:50px 0 0}
h1{font-size:clamp(58px,11vw,170px);line-height:.86;margin-bottom:34px}
h1 em{color:var(--accent)}
.hero-row{display:grid;grid-template-columns:1fr 1.4fr;gap:40px;align-items:end}
.hero p{max-width:380px;font-size:17px;opacity:.8;margin-bottom:28px}
.btn{display:inline-flex;gap:14px;align-items:center;background:var(--accent);color:#141210;text-decoration:none;padding:18px 30px;border-radius:60px;font-weight:600;font-size:14px;transition:transform .3s}
.btn:hover{transform:scale(1.04)}
.hero-photo{height:min(70vh,620px);background:var(--soft) center/cover;border-radius:6px;position:relative;overflow:hidden}
.hero-photo.empty{background:radial-gradient(90% 70% at 70% 30%,rgba(255,255,255,.12),transparent 60%),linear-gradient(150deg,var(--soft) 30%,var(--accent))}
.badge{position:absolute;right:20px;top:20px;width:118px;height:118px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.3;animation:spin 22s linear infinite}
.badge b{font-family:"Instrument Serif";font-size:34px;font-weight:400;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.badge span{display:block;animation:spin 22s linear infinite reverse}
.marquee{border-block:1px solid var(--line);margin-top:70px;overflow:hidden;white-space:nowrap;padding:22px 0}
.marquee div{display:inline-block;animation:mq 30s linear infinite;font-family:"Instrument Serif";font-size:42px}
.marquee i{color:var(--accent);font-style:normal;margin:0 28px}
@keyframes mq{to{transform:translateX(-50%)}}
section{padding:110px 0}
.lab{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
h2{font-size:clamp(40px,5.6vw,80px);line-height:.95}
.about{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
.about p{font-size:20px;line-height:1.6;opacity:.9}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:50px}
.menu div{background:var(--bg);padding:34px 28px;transition:background .3s}
.menu div:hover{background:var(--soft)}
.menu h3{font-family:"Instrument Serif";font-weight:400;font-size:32px;margin-bottom:8px}
.menu p{font-size:14px;opacity:.7}
.menu small{display:block;margin-top:18px;color:var(--accent);font-size:13px;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:260px;gap:12px}
.grid div{background:var(--soft) center/cover;border-radius:4px}
.grid div:first-child{grid-row:span 2}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:50px}
.rev{border:1px solid var(--line);padding:30px;border-radius:6px}
.rev p{font-family:"Instrument Serif";font-size:24px;line-height:1.3;margin:14px 0 20px}
.rev span{font-size:13px;opacity:.7}
.st{color:var(--accent);letter-spacing:3px}
.book{text-align:center}
.book h2{font-size:clamp(50px,9vw,140px);margin-bottom:30px}
.info{display:flex;justify-content:center;gap:50px;flex-wrap:wrap;margin-top:50px;font-size:15px;opacity:.85}
.info b{display:block;font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
footer{border-top:1px solid var(--line);padding:30px 0 110px;font-size:12px;opacity:.55;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.float{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9;background:var(--ink);color:var(--bg);text-decoration:none;border-radius:50px;padding:14px 26px;font-size:14px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1s,transform 1s}
.reveal.in{opacity:1;transform:none}
@media (max-width:860px){
 .hero-row,.about{grid-template-columns:1fr;gap:30px}
 .hero-photo{height:58vh}
 .grid{grid-template-columns:1fr 1fr;grid-auto-rows:180px}
 .grid div:first-child{grid-column:span 2;grid-row:span 1}
 section{padding:76px 0}
 .marquee div{font-size:30px}
}
</style>
</head>
<body>

<div class="ribbon" id="ribbon"></div>
<div class="wrap">
 <header><div class="logo" id="logo"></div><a class="pill" href="#marcar">Marcar</a></header>
 <div class="hero">
  <h1 class="disp" id="title"></h1>
  <div class="hero-row">
   <div><p id="lead"></p><a class="btn wa" href="#">Marcar pelo WhatsApp →</a></div>
   <div class="hero-photo" id="photo"><div class="badge" id="badge"></div></div>
  </div>
 </div>
</div>
<div class="marquee"><div id="mq"></div></div>
<section class="reveal"><div class="wrap about"><div><div class="lab">O espaço</div><h2 class="disp">Sobre nós</h2></div><p id="about"></p></div></section>
<section class="reveal" style="padding-top:0"><div class="wrap"><div class="lab">Serviços</div><h2 class="disp">O que fazemos</h2><div class="menu" id="menu"></div></div></section>
<section class="reveal" id="gal" style="padding-top:0"><div class="wrap grid" id="grid"></div></section>
<section class="reveal" style="padding-top:0"><div class="wrap"><div class="lab">Clientes</div><h2 class="disp" id="revtitle"></h2><div class="revs" id="revs"></div></div></section>
<section class="book reveal" id="marcar"><div class="wrap"><div class="lab" id="city"></div><h2 class="disp">Marque já.</h2><a class="btn wa" href="#">Marcar pelo WhatsApp →</a>
<div class="info"><div><b>Morada</b><span id="addr"></span></div><div><b>Telefone</b><span id="tel"></span></div><div id="igw"><b>Instagram</b><a id="ig" target="_blank" rel="noopener"></a></div></div></div></section>
<div class="wrap"><footer><span id="copy"></span><span>Pré-visualização de demonstração</span></footer></div>
<a class="float wa" href="#">Marcar pelo WhatsApp</a>
<script>
(function(){
var d=JSON.parse(document.getElementById('data').textContent);
var $=function(i){return document.getElementById(i)};
var r=document.documentElement.style;
if(d.paleta){if(d.paleta.accent)r.setProperty('--accent',d.paleta.accent)}
document.title=d.nome+(d.cidade?' · '+d.cidade:'');
$('ribbon').textContent='Pré-visualização criada para '+d.nome;
$('logo').textContent=d.nome;
$('title').innerHTML=d.titulo||d.nome;
$('lead').textContent=d.subtitulo||'';
var f=(d.fotos||[]).filter(Boolean);
if(f[0])$('photo').style.backgroundImage='url("'+f[0]+'")';else $('photo').classList.add('empty');
if(d.nota)$('badge').innerHTML='<span><b>'+String(d.nota).replace('.',',')+'</b>Google<br>'+(d.avaliacoes||'')+' avaliações</span>';else $('badge').remove();
var names=(d.servicos||[]).map(function(s){return s.nome});
var row=names.map(function(n){return n+'<i>✦</i>'}).join('');
$('mq').innerHTML=row+row+row+row;
$('about').textContent=d.sobre||'';
$('menu').innerHTML=(d.servicos||[]).map(function(s){return '<div><h3>'+s.nome+'</h3><p>'+(s.descricao||'')+'</p>'+(s.preco?'<small>'+s.preco+'</small>':'')+'</div>'}).join('');
if(f.length>1)$('grid').innerHTML=f.slice(1,4).map(function(u){return '<div style="background-image:url(&quot;'+u+'&quot;)"></div>'}).join('');else $('gal').style.display='none';
$('revtitle').textContent=d.nota?String(d.nota).replace('.',',')+' estrelas no Google':'O que dizem';
$('revs').innerHTML=(d.depoimentos||[]).slice(0,3).map(function(t){return '<div class="rev"><div class="st">★★★★★</div><p>“'+t.texto+'”</p><span>'+t.nome+'</span></div>'}).join('');
$('city').textContent=d.cidade||'';
$('addr').textContent=d.endereco||'';
$('tel').innerHTML='<a href="tel:'+(d.telefone||'').replace(/\s/g,'')+'">'+(d.telefone||'')+'</a>';
if(d.instagram){$('ig').href=d.instagram;$('ig').textContent=d.instagram.replace(/^https?:\/\/(www\.)?instagram\.com\//,'@').replace(/[/?].*$/,'')}else $('igw').style.display='none';
$('copy').textContent='© '+new Date().getFullYear()+' '+d.nome;
var wa='https://wa.me/'+(d.whatsapp||'')+'?text='+encodeURIComponent('Olá! Gostaria de marcar um horário.');
[].forEach.call(document.querySelectorAll('.wa'),function(a){a.href=wa;a.target='_blank'});
var io=new IntersectionObserver(function(e){e.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.1});
[].forEach.call(document.querySelectorAll('.reveal'),function(el){io.observe(el)});
})();
</script>

</html>
